name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release, e.g. 1.2.0 or 1.2.0-qa.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Work out the version and channel
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              '${{ inputs.version }}'
          } else {
              '${{ github.ref_name }}' -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "'$version' is not a valid semantic version."
          }

          # The prerelease label decides the channel, and the channel decides which machines
          # will install it. This must match Phoenix's ChannelResolver exactly.
          $channel = if ($version -notmatch '-') {
              'Production'
          } else {
              switch (($version -split '-', 2)[1].Split('.')[0].ToLowerInvariant()) {
                  'qa'    { 'QA' }
                  'beta'  { 'QA' }
                  'rc'    { 'QA' }
                  default { 'Development' }
              }
          }

          "version=$version"                                     >> $env:GITHUB_OUTPUT
          "channel=$channel"                                     >> $env:GITHUB_OUTPUT
          "prerelease=$(($channel -ne 'Production').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "Releasing $version on the $channel channel."

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:PhoenixVersion=${{ steps.version.outputs.version }}

      - name: Unit tests
        run: dotnet test tests/Phoenix.Tests/Phoenix.Tests.csproj --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/Phoenix.IntegrationTests/Phoenix.IntegrationTests.csproj --configuration Release --no-build

      # Nothing below this line runs if the tests failed.
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }} -OutputDirectory artifacts/release

      - name: Validate the artifacts against the manifest
        shell: pwsh
        run: ./scripts/Test-ReleaseArtifacts.ps1 -ArtifactDirectory artifacts/release -ExpectedVersion ${{ steps.version.outputs.version }} -ExpectedChannel ${{ steps.version.outputs.channel }}

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $channel = '${{ steps.version.outputs.channel }}'
          $tag = "v$version"

          $notes = @"
          **Channel:** $channel

          Phoenix installs this release only on machines configured for the **$channel** channel.

          | Asset | Purpose |
          | --- | --- |
          | ``phoenix-win-x64.zip`` | The Phoenix bootstrapper, self-contained (no .NET runtime needed) |
          | ``phoenix-demoapp-win-x64.zip`` | The demo application Phoenix installs |
          | ``release-manifest.json`` | Machine-readable description Phoenix reads first |
          | ``SHA256SUMS`` | Checksums for every package |

          Verify a download with:
          ``````
          Get-FileHash .\phoenix-demoapp-win-x64.zip -Algorithm SHA256
          ``````
          "@

          $prerelease = if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { '--prerelease' } else { '' }

          $arguments = @('release', 'create', $tag, '--title', "$channel $version", '--notes', $notes)
          if ($prerelease) { $arguments += $prerelease }
          $arguments += (Get-ChildItem artifacts/release -File | ForEach-Object { $_.FullName })

          & gh @arguments

      - name: Upload the artifacts to the workflow run as well
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: artifacts/release
